services:
  openflexure-microscope:
    build: .
    restart: always
    # Host networking lets the connector be discovered via mDNS on the LAN and resolve `microscope.local`.
    # It only works on a Linux Docker host; on Docker Desktop (Windows/macOS) publish the SiLA port instead
    # and set `host` in config.json to the microscope's IP address.
    network_mode: host
    volumes:
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
      # ExportCapture saves to ~/Downloads/OpenFlexure by default, which is /root/Downloads/OpenFlexure in the
      # container. Mounting it keeps exported images in ./exports on the host when the container is rebuilt.
      - type: bind
        source: ./exports
        target: /root/Downloads/OpenFlexure
        bind:
          create_host_path: true
    command: ["connector", "start", "--app", "unitelabs.openflexure_microscope:create_app", "-cfg", "/app/config.json"]
